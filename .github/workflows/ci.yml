name: ci

# The gate for this repository: the same steps `bun run check` runs locally, then the harness
# on a real WebGPU device (headless Chromium on SwiftShader, as the compiler's journeys run), the
# traceability tree under Doorstop, and, on a pull request, what a move of the compiler pin owes
# this repository. Each job's `name:` is
# a required check of the `main` ruleset (CLAUDE.md, Merging): renaming one changes the ruleset
# in the same step.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Decides whether a pull request changes documents only. The harness and the compiler bump jobs
    # skip their costly steps then. Both jobs still run and report, so each required check reports.
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.rule.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: rule
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          : > changed.txt
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed.txt
            docs_only=true
            [ -s changed.txt ] || docs_only=false
            while IFS= read -r path; do
              case "$path" in
                site/src/content/docs/api/*) docs_only=false ;;
                site/src/content/docs/*.md | site/src/content/docs/*.mdx) ;;
                docs/* | reqs/* | .claude/* | README.md | CLAUDE.md | LICENSE) ;;
                *) docs_only=false ;;
              esac
            done < changed.txt
          fi
          echo "event: $EVENT_NAME"
          echo "changed files:"
          cat changed.txt
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  check:
    name: format + boundary + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The compiler is a pinned submodule until it publishes; every package imports it.
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check:prose
      - run: bun run check:ste
      - run: bun run check:boundary
      - run: bun run gate:api
      - run: bun run gate:site
      - run: bun run check:shaders
      - run: bun run typecheck
      - run: bun run test

  harness:
    name: harness (headless WebGPU)
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    steps:
      - run: echo 'docs-only pull request, skipped'
        if: needs.changes.outputs.docs_only == 'true'
      - uses: actions/checkout@v5
        if: needs.changes.outputs.docs_only != 'true'
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.docs_only != 'true'
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.docs_only != 'true'
      - run: npx playwright install --with-deps chromium
        if: needs.changes.outputs.docs_only != 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ''
      - run: bun run harness
        if: needs.changes.outputs.docs_only != 'true'
      # The preview the harness writes, and each example's render, to look at. Nothing holds the
      # preview to a golden. The render gate holds each render to one and names the file of a miss.
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.docs_only != 'true'
        with:
          name: cornell-preview
          path: |
            .harness/cornell.png
            .harness/site.png
            .harness/render-*.png
          if-no-files-found: ignore
          include-hidden-files: true

  traceability:
    # Doorstop over reqs/ (reqs/README.md): fails on a design record changed without review, a
    # decision left suspect by its record, or a verifying file that no longer carries its tag.
    # Nothing is installed with bun, so no node_modules copy of the compiler is in the tree.
    name: traceability (Doorstop)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install doorstop==3.2
      # -e: every warning is an error, so an unreviewed item or a suspect link fails.
      # -F: validate without reformatting.
      - run: doorstop -e -F
      - run: doorstop publish all traceability
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability
          path: traceability

  compiler-bump:
    # What a compiler bump owes this repository: a package, a document or a test that still
    # names an export or a file the new pin removes fails here, as does a compiler ThenChange
    # target in this repository that the branch did not change. Both scripts run from the pinned
    # compiler, so a pin from before they existed skips the job's checks.
    name: compiler bump impact
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 10
    steps:
      - run: echo 'docs-only pull request, skipped'
        if: needs.changes.outputs.docs_only == 'true'
      - uses: actions/checkout@v5
        if: needs.changes.outputs.docs_only != 'true'
        with:
          submodules: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.docs_only != 'true'
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.docs_only != 'true'
      - if: needs.changes.outputs.docs_only != 'true'
        run: |
          [ ! -f vendor/typeshade/scripts/downstream-impact.ts ] || \
            bun vendor/typeshade/scripts/downstream-impact.ts --repo radiance --submodule vendor/typeshade
      - if: needs.changes.outputs.docs_only != 'true'
        run: |
          [ ! -f vendor/typeshade/scripts/ifchange.ts ] || \
            TYPESHADE_DOCS_ROOT=$PWD bun vendor/typeshade/scripts/ifchange.ts
