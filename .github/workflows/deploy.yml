name: deploy

# game.typeshade.dev: the page of the first reference game, built with its readout and deployed
# to Cloudflare Workers on every push to `main` (wrangler.jsonc, design record 0110). The owner
# opens it on a phone. A Cloudflare Access application of the owner's account limits the address
# to the owner. This workflow is not a required check: ci.yml's harness job builds the same page
# and runs it before a merge. Without the CLOUDFLARE_API_TOKEN secret the job says so and passes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  cloudflare:
    name: cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare
      url: https://game.typeshade.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun bin/radiance.ts build --readout examples/factory
      - name: Deploy examples/factory/dist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret; the page is not deployed."
            exit 0
          fi
          bunx wrangler@4 deploy
