name: deploy

# radiance.typeshade.dev: the library's site (site/: the front page, the guide, the examples
# and the API reference), built to dist/site and deployed to Cloudflare Workers on every push to
# `main` (wrangler.jsonc). This workflow is not a required check; ci.yml's harness job already
# builds the site and runs an example on it before a merge. Without the CLOUDFLARE_API_TOKEN
# secret the job says so and passes.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  cloudflare:
    name: cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare
      url: https://radiance.typeshade.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run site
      - name: Deploy dist/site
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret; the site is not deployed."
            exit 0
          fi
          bunx wrangler deploy
